name: Build APK + AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          [ -z "$SDK" ] && SDK="/usr/local/lib/android/sdk"
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" >/dev/null 2>&1 || true

      - name: Decode keystore (si existe)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          ls -la ${{ github.workspace }}/release.jks

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK + AAB (firmado)
        if: env.KEYSTORE_BASE64 != ''
        env:
          ENCRYPTOR255_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          ENCRYPTOR255_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ENCRYPTOR255_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ENCRYPTOR255_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verificar artefactos
        run: |
          echo "── debug ──"
          ls -la app/build/outputs/apk/debug/ || true
          echo "── release ──"
          ls -la app/build/outputs/apk/release/ || true
          echo "── bundle ──"
          ls -la app/build/outputs/bundle/release/ || true

      - name: Upload artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Encryptor255
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
